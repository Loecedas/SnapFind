name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish and package both editions
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $editions = @(
            @{ Name = "Rapid";  Project = "src/SnapFind.Rapid.csproj" },
            @{ Name = "Paddle"; Project = "src/SnapFind.csproj" }
          )
          foreach ($e in $editions) {
            Write-Host "Publishing $($e.Name) edition..." -ForegroundColor Cyan
            $pubDir = "releases/tmp/$($e.Name)"
            dotnet publish $e.Project -c Release -r win-x64 --self-contained false `
              -p:PublishSingleFile=true -p:Version=$version -o $pubDir

            if ($e.Name -eq "Rapid") {
              New-Item -ItemType Directory -Path "$pubDir/libs/rapid" -Force | Out-Null
              Copy-Item "libs/rapid/*" "$pubDir/libs/rapid" -Recurse -Force
            } else {
              New-Item -ItemType Directory -Path "$pubDir/libs" -Force | Out-Null
              Copy-Item "libs/*" "$pubDir/libs" -Recurse -Force
            }

            New-Item -ItemType Directory -Path "releases/portables" -Force | Out-Null
            Compress-Archive -Path "$pubDir/*" `
              -DestinationPath "releases/portables/SnapFindPortable_$($e.Name)_v$version.zip" -Force
          }

      - name: Build installers with Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $editions = @("Rapid", "Paddle")
          $iscc = "${{ github.workspace }}/tools/InnoSetup/ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Warning "ISCC.exe not found at $iscc, skipping installer build"
            exit 0
          }
          foreach ($ed in $editions) {
            Write-Host "Building installer for $ed edition..." -ForegroundColor Cyan
            $outDir = "${{ github.workspace }}/releases/installers"
            $pubDir = "${{ github.workspace }}/releases/tmp/$ed"
            New-Item -ItemType Directory -Path $outDir -Force | Out-Null
            & $iscc /DAppVersion=$version /DEdition=$ed /DPublishDir="$pubDir" /O$outDir "${{ github.workspace }}/src/setup.iss"
          }

      - name: Create GitHub Release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release create $tag --generate-notes 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release already exists, uploading assets only"
          }
          gh release upload $tag releases/portables/*.zip releases/installers/*.exe --clobber
