name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish and package both editions
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $editions = @(
            @{ Name = "Rapid";  Project = "src/SnapFind.Rapid.csproj" },
            @{ Name = "Paddle"; Project = "src/SnapFind.csproj" }
          )
          foreach ($e in $editions) {
            Write-Host "Publishing $($e.Name) edition..." -ForegroundColor Cyan
            $pubDir = "releases/tmp/$($e.Name)"
            dotnet publish $e.Project -c Release -r win-x64 --self-contained false `
              -p:PublishSingleFile=true -p:Version=$version -o $pubDir
            if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed: $LASTEXITCODE" }

            if ($e.Name -eq "Rapid") {
              New-Item -ItemType Directory -Path "$pubDir/libs/rapid" -Force | Out-Null
              Copy-Item "libs/rapid/*" "$pubDir/libs/rapid" -Recurse -Force
            } else {
              New-Item -ItemType Directory -Path "$pubDir/libs" -Force | Out-Null
              Get-ChildItem "libs" | Where-Object { $_.Name -ne "rapid" } | Copy-Item -Destination "$pubDir/libs" -Recurse -Force
            }

            New-Item -ItemType Directory -Path "${{ github.workspace }}/releases/portables" -Force | Out-Null
            $exe7z = if (Test-Path "${{ github.workspace }}/tools/7-Zip/7z.exe") { "${{ github.workspace }}/tools/7-Zip/7z.exe" } else { "7z" }
            $destZip = "${{ github.workspace }}/releases/portables/SnapFindPortable_$($e.Name)_v$version.zip"
            Push-Location $pubDir
            try {
              & $exe7z a -tzip -mx=9 -mmt=on "$destZip" *
              if ($LASTEXITCODE -ne 0) { throw "7z zip packaging failed: $LASTEXITCODE" }
            } finally {
              Pop-Location
            }
          }

      - name: Build installers with Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $editions = @("Rapid", "Paddle")
          $iscc = "${{ github.workspace }}/tools/InnoSetup/ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Warning "ISCC.exe not found at $iscc, skipping installer build"
            throw "ISCC compiler not found at $iscc!"
          }
          foreach ($ed in $editions) {
            Write-Host "Building installer for $ed edition..." -ForegroundColor Cyan
            $outDir = "${{ github.workspace }}/releases/installers"
            $pubDir = "${{ github.workspace }}/releases/tmp/$ed"
            New-Item -ItemType Directory -Path $outDir -Force | Out-Null
            & $iscc /DAppVersion=$version /DEdition=$ed /DPublishDir="$pubDir" /O$outDir "${{ github.workspace }}/src/setup.iss"
            if ($LASTEXITCODE -ne 0) { throw "ISCC compilation failed: $LASTEXITCODE" }
          }

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $files = Get-ChildItem releases/portables/*.7z.exe, releases/installers/*.exe
          $checksums = foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($file.Name)"
          }
          New-Item -ItemType Directory -Path "releases" -Force | Out-Null
          $checksums | Set-Content "releases/SHA256SUMS.txt" -Encoding ascii

      - name: Create GitHub Release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $tagNotes = git tag -l --format="%(contents)" $tag
          if ($tagNotes -and $tagNotes.Trim()) {
            $notesFile = "${{ github.workspace }}/releases/release_notes.md"
            [System.IO.File]::WriteAllText($notesFile, $tagNotes, [System.Text.Encoding]::UTF8)
            gh release create $tag -F $notesFile 2>$null
          } else {
            gh release create $tag --generate-notes 2>$null
          }
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release already exists, uploading assets only"
          }
          $uploadItems = @("releases/portables/*.7z.exe", "releases/installers/*.exe", "releases/SHA256SUMS.txt")
          if (Test-Path "releases/plugins/*.zip") { $uploadItems += "releases/plugins/*.zip" }
          gh release upload $tag $uploadItems --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release upload failed: $LASTEXITCODE" }
