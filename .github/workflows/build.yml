name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - src/SnapFind.Rapid.csproj
          - src/SnapFind.csproj
          - src/Plugins/SnapFind.Plugin.Translation/SnapFind.Plugin.Translation.csproj
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build ${{ matrix.project }}
        run: dotnet build ${{ matrix.project }} -c Release

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test
        run: dotnet test tests/SnapFind.Tests.csproj -c Release --collect:"XPlat Code Coverage"
